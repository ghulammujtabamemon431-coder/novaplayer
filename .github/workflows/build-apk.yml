name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: |
          python3 - << 'PY'
          import os, json, struct, zlib
          def chunk(t, d):
              c = t + d
              import binascii
              crc = binascii.crc32(c) & 0xffffffff
              return struct.pack(">I", len(d)) + c + struct.pack(">I", crc)
          def make_png(path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              raw = b"".join([b"\x00" + b"\xff\xff\xff\x00" * 512 for _ in range(512)])
              data = b"\x89PNG\r\n\x1a\n"
              data += chunk(b"IHDR", struct.pack(">IIBBBBB", 512, 512, 8, 6, 0, 0, 0))
              data += chunk(b"IDAT", zlib.compress(raw))
              data += chunk(b"IEND", b"")
              open(path, "wb").write(data)
          for f in ["assets/icon.png", "assets/adaptive-icon.png", "assets/splash.png"]:
              if not os.path.exists(f):
                  make_png(f)
                  print("Created", f)
          if os.path.exists("app.json"):
              with open("app.json") as fh:
                  j = json.load(fh)
              expo = j.get("expo", j)
              if "splash" in expo:
                  del expo["splash"]
                  print("Removed splash from app.json")
              with open("app.json", "w") as fh:
                  json.dump(j, fh, indent=2)
          PY
      - run: npx expo prebuild --platform android --clean
      - run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text()
          if "signingConfig signingConfigs.debug" not in t:
              t = t.replace("release {", "release {\n            signingConfig signingConfigs.debug", 1)
          p.write_text(t)
          print("Patched signing")
          print(t[t.find("buildTypes"):t.find("buildTypes")+500])
          PY
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
