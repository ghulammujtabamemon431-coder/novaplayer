name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Fix app.json for build
        run: |
          python3 - << 'PYEOF'
          import json
          with open('app.json') as f:
              data = json.load(f)
          expo = data.get('expo', {})
          expo['version'] = '1.0.0'
          expo['android'] = expo.get('android', {})
          expo['android']['versionCode'] = 1
          expo['android']['package'] = 'com.novamax.player'
          if 'icon' in expo:
              del expo['icon']
          if 'splash' in expo:
              del expo['splash']
          if 'ios' in expo and 'icon' in expo['ios']:
              del expo['ios']['icon']
          if 'adaptiveIcon' in expo.get('android', {}):
              del expo['android']['adaptiveIcon']
          if 'foregroundImage' in expo.get('android', {}):
              del expo['android']['foregroundImage']
          expo['plugins'] = [p for p in expo.get('plugins', []) if 'expo-splash-screen' not in str(p)]
          with open('app.json','w') as f:
              json.dump(data, f, indent=2)
          print('app.json fixed')
          PYEOF

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Patch android/app/build.gradle (Use default debug signing for release)
        run: |
          FILE=android/app/build.gradle
          cp "$FILE" "${FILE}.bak"
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text()
          # Pehle se lagi hui koi debug signing line hata do taake double na ho
          t = t.replace("signingConfig signingConfigs.debug", "")
          # Release ko Gradle ke built-in debug keystore se sign karo, alag keystore banane ki zaroorat nahi
          if "release {" in t:
              t = t.replace("release {", "release {\n            signingConfig signingConfigs.debug", 1)
          p.write_text(t)
          print("patched")
          PYEOF
          cat "$FILE"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android && ./gradlew assembleRelease --stacktrace
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: List APK
        run: ls -lh android/app/build/outputs/apk/release/

      - name: Copy APK to root for easy download
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/NovaMax-v1.0.0.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/NovaMax-v1.0.0.apk || true
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaMax-APK
          path: output/NovaMax-v1.0.0.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NovaMax v1.0.0 Build ${{ github.run_number }}
          body: |
            NovaMax Player APK Build
            Built from commit ${{ github.sha }}
          body_path: null
          files: output/NovaMax-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
