
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p assets
          python3 << 'PY'
          import os, zlib, struct, json
          def make_png(path):
              w = h = 1024
              raw = b"".join([b"\x00" + b"\xff\xff\xff" * w for _ in range(h)])
              def chunk(t, d):
                  c = t + d
                  return struct.pack(">I", len(d)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
              data = b"\x89PNG\r\n\x1a\n"
              data += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
              data += chunk(b"IDAT", zlib.compress(raw))
              data += chunk(b"IEND", b"")
              open(path, "wb").write(data)
          for f in ["assets/icon.png", "assets/adaptive-icon.png", "assets/splash.png", "assets/favicon.png"]:
              if not os.path.exists(f):
                  make_png(f)
                  print("Created", f)
          # Splash ko app.json se hata do taake prebuild splash pe na ruke
          if os.path.exists("app.json"):
              with open("app.json") as fh:
                  j = json.load(fh)
              expo = j.get("expo", j)
              if "splash" in expo:
                  del expo["splash"]
                  print("Removed splash from app.json")
              with open("app.json", "w") as fh:
                  json.dump(j, fh, indent=2)
          PY
      - run: npx expo prebuild --platform android --clean
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
